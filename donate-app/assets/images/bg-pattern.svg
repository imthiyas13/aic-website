<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <g id="star8">
      <!-- Classic 8-point star: two squares rotated 45° -->
      <rect x="-40" y="-40" width="80" height="80"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(45)"/>
    </g>
    <g id="rosette">
      <!-- Inner rosette: small 8-point star inside a circle -->
      <circle r="22"/>
      <rect x="-15" y="-15" width="30" height="30"/>
      <rect x="-15" y="-15" width="30" height="30" transform="rotate(45)"/>
      <circle r="6"/>
    </g>
    <g id="octagon">
      <!-- Small octagon decoration -->
      <polygon points="-14,-6 -6,-14 6,-14 14,-6 14,6 6,14 -6,14 -14,6"/>
    </g>
  </defs>
  <g fill="none" stroke="#0473df" stroke-width="1.4" stroke-linejoin="round" opacity="0.14">
    <!-- Center rosette + 8-point star -->
    <use href="#star8" x="100" y="100"/>
    <use href="#rosette" x="100" y="100"/>

    <!-- Large 8-point stars at corners (split across tiles) -->
    <use href="#star8" x="0" y="0"/>
    <use href="#star8" x="200" y="0"/>
    <use href="#star8" x="0" y="200"/>
    <use href="#star8" x="200" y="200"/>
    <use href="#rosette" x="0" y="0"/>
    <use href="#rosette" x="200" y="0"/>
    <use href="#rosette" x="0" y="200"/>
    <use href="#rosette" x="200" y="200"/>

    <!-- Connecting octagons at edge midpoints -->
    <use href="#octagon" x="100" y="0"/>
    <use href="#octagon" x="100" y="200"/>
    <use href="#octagon" x="0" y="100"/>
    <use href="#octagon" x="200" y="100"/>

    <!-- Thin connecting lines between stars -->
    <line x1="100" y1="40" x2="100" y2="60"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
    <line x1="40" y1="100" x2="60" y2="100"/>
    <line x1="140" y1="100" x2="160" y2="100"/>

    <line x1="100" y1="0" x2="100" y2="14"/>
    <line x1="100" y1="186" x2="100" y2="200"/>
    <line x1="0" y1="100" x2="14" y2="100"/>
    <line x1="186" y1="100" x2="200" y2="100"/>
  </g>
</svg>
