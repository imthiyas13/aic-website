<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f9d93">
<title>Alton Islamic Centre Admin — Salah Times</title>
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --line: #e5e7eb;
    --line-soft: #eef0ee;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #2f9d93;
    --accent-dark: #264a56;
    --accent-soft: #e4f3f1;
    --danger: #b3261e;
    --warn-bg: #fff4e6;
    --warn-line: #e8a94a;
    --ok-bg: #e6f7ea;
    --err-bg: #fde2e2;
    --err-line: #d9534f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    padding: 1rem;
    padding-bottom: 4rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header.page {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.4rem 0.8rem;
    margin-bottom: 1rem;
  }
  header.page h1 {
    font-size: 1.5rem; margin: 0;
    color: var(--accent-dark);
  }
  .updated { color: var(--muted); font-size: 0.85rem; }
  .signout {
    background: transparent; border: 0;
    color: var(--muted); font-size: 0.85rem;
    padding: 0.2rem 0.5rem; cursor: pointer;
    text-decoration: underline; min-height: auto;
  }

  .toast {
    position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; padding: 0.8rem 1.2rem; border-radius: 0.6rem;
    font-size: 0.95rem; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 100;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    max-width: calc(100vw - 2rem);
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }

  section.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    padding: 1rem;
    margin-bottom: 1.2rem;
  }
  section.card > h2 {
    font-size: 1.1rem; margin: 0 0 0.8rem;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.5rem;
  }
  section.card > h2 .count {
    color: var(--muted); font-size: 0.85rem; font-weight: 500;
  }
  .empty {
    color: var(--muted); padding: 0.9rem; font-size: 0.95rem;
    text-align: center;
    background: var(--line-soft);
    border-radius: 0.5rem;
    margin: 0 0 0.7rem;
  }
  .info-banner {
    background: var(--accent-soft); color: var(--accent-dark);
    border: 1px solid var(--accent);
    padding: 0.7rem 0.9rem; border-radius: 0.5rem;
    font-size: 0.85rem; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.7rem;
    flex-wrap: wrap;
  }
  .info-banner .banner-actions {
    display: flex; gap: 0.4rem; flex-shrink: 0;
    flex: 1;
  }
  .info-banner .banner-actions button { flex: 1; }
  .info-banner .banner-actions button {
    padding: 0.4rem 0.75rem; min-height: 34px;
    font-size: 0.82rem; font-weight: 600;
  }
  .info-banner .banner-actions .icon-btn {
    padding: 0.4rem 0.55rem; font-size: 1rem;
  }

  .kiosk-status {
    padding: 0.7rem 0.9rem; border-radius: 0.5rem;
    font-size: 0.88rem; margin-bottom: 1rem;
    background: #f9fafb; border: 1px solid var(--line);
    color: var(--text);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .kiosk-status:empty { display: none; }
  .kiosk-status.ok      { background: var(--ok-bg);   border-color: var(--accent);   color: var(--accent-dark); }
  .kiosk-status.err     { background: var(--err-bg);  border-color: var(--err-line); color: var(--danger); }
  .kiosk-status.pending { background: var(--warn-bg); border-color: var(--warn-line); color: #8a5a00; }
  .kiosk-status .ts { color: var(--muted); font-size: 0.78rem; margin-left: auto; flex-shrink: 0; }

  .item {
    background: #fafbfa;
    border: 1px solid var(--line);
    border-radius: 0.7rem;
    padding: 0.85rem 0.95rem;
    margin-bottom: 0.6rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.5rem 0.8rem;
    align-items: start;
  }
  .item .info {
    display: flex; flex-direction: column;
    gap: 0.3rem; min-width: 0;
  }
  .item .top {
    display: flex; align-items: center;
    flex-wrap: wrap; gap: 0.5rem 0.7rem;
  }
  .item .time {
    font-size: 1.45rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text); line-height: 1;
  }
  .pill {
    display: inline-block; padding: 0.22rem 0.7rem; border-radius: 999px;
    background: #eef2ff; color: #3730a3;
    font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.02em;
  }
  .pill.eid {
    background: #fef3c7; color: #92400e;
    font-size: 0.85rem; padding: 0.3rem 0.8rem;
  }
  .item .when {
    color: var(--muted); font-size: 0.92rem;
  }
  .item .note {
    color: var(--text); font-size: 0.95rem; word-wrap: break-word;
  }
  .item .actions {
    display: flex; gap: 0.4rem; flex-direction: column; align-self: stretch;
  }
  .item .actions button {
    padding: 0.45rem 0.8rem; min-height: 38px;
    font-size: 0.85rem; font-weight: 600;
  }
  @media (min-width: 540px) {
    .item .actions { flex-direction: row; align-self: start; }
  }

  .eid-times {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0.45rem; margin-top: 0.3rem;
  }
  .eid-times .slot {
    background: #fff; border: 1px solid var(--line);
    border-radius: 0.45rem; padding: 0.4rem 0.5rem;
    display: flex; flex-direction: column; align-items: center;
    gap: 0.1rem;
  }
  .eid-times .slot .lbl {
    font-size: 0.65rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .eid-times .slot .val {
    font-size: 1.05rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .eid-times .slot.empty { opacity: 0.4; }

  form.editor {
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    border-radius: 0.75rem;
    padding: 1rem;
    margin-bottom: 0.6rem;
    display: grid; gap: 0.7rem;
  }
  form.editor h3 {
    margin: 0 0 0.1rem; font-size: 1rem;
    color: var(--accent-dark);
  }
  form.editor label { display: block; }
  form.editor label .lbl {
    display: block; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 0.3rem; font-weight: 700;
  }
  form.editor input,
  form.editor textarea,
  form.editor select {
    width: 100%; padding: 0.7rem 0.8rem;
    font-size: 16px;
    border: 1px solid var(--line); border-radius: 0.5rem;
    background: #fff; color: var(--text);
    font-family: inherit;
    min-height: 44px;
  }
  form.editor textarea { resize: vertical; line-height: 1.5; }
  form.editor input:focus,
  form.editor textarea:focus,
  form.editor select:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  form.editor .checkbox-row {
    display: flex; align-items: center; gap: 0.55rem;
    font-size: 0.95rem; padding: 0.2rem 0;
  }
  form.editor .checkbox-row input {
    width: 20px; height: 20px; min-height: auto; margin: 0;
  }
  form.editor .form-actions {
    display: flex; gap: 0.5rem; margin-top: 0.3rem;
  }
  form.editor .form-actions button { flex: 1; }

  button {
    border: 0; border-radius: 0.5rem;
    padding: 0.7rem 1rem; font-size: 16px;
    font-weight: 600; font-family: inherit;
    cursor: pointer; min-height: 44px;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost {
    background: #fff; color: var(--text);
    border: 1px solid var(--line);
  }
  button.ghost:hover { background: #f3f4f6; }
  button.danger {
    background: #fff; color: var(--danger);
    border: 1px solid #f3cfcf;
  }
  button.danger:hover { background: var(--err-bg); border-color: var(--err-line); }
  button.add-btn {
    width: 100%; padding: 0.95rem;
    background: transparent; color: var(--accent-dark);
    border: 2px dashed var(--accent);
    font-size: 1rem; min-height: 52px;
  }
  button.add-btn:hover { background: var(--accent-soft); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Reminder carousel curation */
  .kind-toggles { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
  button.kind-toggle { flex: 1 1 auto; min-width: 110px; opacity: 0.55; }
  button.kind-toggle.on { opacity: 1; border-color: var(--accent); color: var(--accent-dark); }
  button.kind-toggle .count {
    margin-left: 0.4rem; font-size: 0.8rem; color: var(--muted);
  }
  .item.dimmed { opacity: 0.5; }
  .item .arabic-line {
    font-size: 1.15rem; line-height: 1.9;
    color: var(--text); word-wrap: break-word;
    font-family: "Amiri", "Traditional Arabic", serif;
  }
  .filter-bar {
    display: flex; gap: 0.4rem; flex-wrap: wrap;
    margin-bottom: 0.7rem;
  }
  .filter-bar input {
    flex: 1 1 180px; min-width: 0;
  }
  .filter-bar input, .filter-bar select {
    padding: 0.55rem 0.7rem; font-size: 16px;
    border: 1px solid var(--line); border-radius: 0.5rem;
    background: #fff; color: var(--text);
    font-family: inherit; min-height: 42px;
  }
  .filter-bar select { flex: 0 1 auto; }
  .filter-bar input:focus, .filter-bar select:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .filter-count {
    color: var(--muted); font-size: 0.8rem;
    margin-bottom: 0.5rem;
  }
  /* Type of the reminder being edited — shown, not chosen. */
  form.editor .fixed-kind {
    padding: 0.6rem 0.8rem; min-height: 44px;
    display: flex; align-items: center;
    border: 1px dashed var(--line); border-radius: 0.5rem;
    background: #fff; color: var(--muted);
    font-size: 0.95rem; font-weight: 600;
  }

  .auth-block {
    text-align: center; padding: 2rem 1rem;
    max-width: 420px; margin: 0 auto;
  }
  .auth-block h1 { margin: 0 0 0.4rem; color: var(--accent-dark); }
  .auth-block .desc {
    color: var(--muted); font-size: 0.95rem;
    margin: 0 0 1.5rem; line-height: 1.5;
  }
  .auth-block .desc a { color: var(--accent); }
  .auth-block input {
    width: 100%; margin: 0 0 0.8rem;
    padding: 0.8rem 1rem; font-size: 16px; min-height: 48px;
    border: 1px solid var(--line); border-radius: 0.5rem;
    background: #fff;
  }
  .auth-block button { width: 100%; min-height: 48px; }
  .auth-block .err-msg {
    color: var(--danger); font-size: 0.9rem;
    background: var(--err-bg); border: 1px solid var(--err-line);
    padding: 0.6rem; border-radius: 0.4rem;
    margin-bottom: 1rem;
  }

  .save-status {
    margin-top: 0.6rem; font-size: 0.85rem;
    color: var(--muted); text-align: center;
  }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="auth-block">
    <h1>Alton Islamic Centre - Admin</h1>
    <p class="desc">Loading…</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- Config ----------
   ALTON DEPLOYMENT: fill these in before use.
   - REPO_OWNER/REPO_NAME: the GitHub repo hosting Alton's data/overrides.json.
   - PI_URL: derived from the address the page was served on; only the
     local-file fallback is hardcoded.
   The refresh key is NOT stored here — see getRefreshKey() below. */
const REPO_OWNER = 'imthiyas13';
const REPO_NAME = 'alton-website';
// Read-only source of the shipped ayahs/hadiths/sayings.
const DISPLAY_REPO = 'alton-masjid-display';
const FILE_PATH = 'data/overrides.json';
// Carousel curation. Same repo as the overrides; the Pi syncs both.
const CONTENT_PATH = 'data/content.json';
const REMINDER_KINDS = ['Ayah', 'Hadith', 'Wisdom'];
const BRANCH = 'main';

// Kiosk (Pi). When the Pi itself serves this page — over plain http, whether
// that is mosque WiFi (altonpi.local / 192.168.x) or Tailscale — talk back to
// whatever address the browser actually used. Same origin, so no CORS and no
// mixed content, and it works from both networks without editing this file.
// The Tailscale address is only the fallback for opening admin.html as a local
// file; an https host keeps that fallback too so the mixed-content path below
// still opens the Pi in a new tab rather than fetching the wrong host.
const PI_URL = location.protocol === 'http:'
  ? location.origin
  : 'http://100.81.30.94:8080';

// The refresh key (AIC_REFRESH_KEY on the Pi) is deliberately not committed —
// it lets anyone who can reach the Pi trigger a git pull and a service restart.
// Prompted for once per browser and kept in localStorage, the same place the
// admin password already lives. Read it off the Pi with:
//   grep AIC_REFRESH_KEY /etc/systemd/system/aic-display.service
const REFRESH_KEY_STORE = 'aic-alton-refresh-key';

function getRefreshKey() {
  let key = localStorage.getItem(REFRESH_KEY_STORE) || '';
  if (!key) {
    key = (window.prompt('Kiosk refresh key (from the Pi\'s aic-display.service):') || '').trim();
    if (key) localStorage.setItem(REFRESH_KEY_STORE, key);
  }
  return key;
}

// Admin login — the GitHub token IS the credential; it is entered once and
// kept in this browser's localStorage. NOTHING SECRET IS STORED IN THIS FILE.
//
// This page used to ship the token XOR'd against an admin password
// (PAT_ENCRYPTED). That is obfuscation, not encryption: every PAT begins with
// the known 11 characters "github_pat_", so XORing the ciphertext against that
// prefix hands back the first 11 characters of the password, and with them the
// token — entirely, if the password was 11 characters or shorter. It held up
// only as long as nobody could read the file. On 2026-08-15 we found this page
// published at aldershotislamiccentre.org.uk/alton-admin.html out of the public
// aic-website repo, so the token had been world-readable since 11 August. That
// token was revoked and the scheme replaced with this one.
//
// Give a new admin the token itself, through a password manager. It needs:
//   alton-website        Contents: Read and write   (overrides + reminders)
//   alton-masjid-display Contents: Read             (list shipped reminders)
const AUTH_KEY = 'alton-admin-token';

const PRAYERS_STD = [
  { key: 'fajr',    label: 'Fajr' },
  { key: 'zuhr',    label: 'Zuhr' },
  { key: 'asr',     label: 'Asr' },
  { key: 'maghrib', label: 'Maghrib' },
  { key: 'isha',    label: 'Isha' },
  { key: 'jumma1',  label: "Jumu'ah 1" },
  { key: 'jumma2',  label: "Jumu'ah 2" },
];
const EID_KEYS = ['eid1', 'eid2', 'eid3'];
const EID_LABELS = ['1st Salah', '2nd Salah', '3rd Salah'];
const INDEF = '9999-12-31';

const root = document.getElementById('root');
const toastEl = document.getElementById('toast');
let pat = '';  // the token, entered on sign-in and cached in localStorage
let state = {
  rules: [],
  updatedAt: null,
  fileSha: null,
  adding: null,        // null | 'ovd' | 'eid' | 'item'
  editing: null,       // null | { kind, idx | date }
  kioskStatus: null,   // null | { text, kind, ts }
  content: null,       // { show, hidden, items } from data/content.json
  contentSha: null,    // null when the file does not exist yet
  builtins: null,      // { Ayah: [], Hadith: [], Wisdom: [] } read off the Pi
  builtinsErr: null,   // set when the Pi could not be reached
  filter: { q: '', kind: 'all', status: 'all' },  // browsing only, never saved
};

/* ---------- Helpers ---------- */

function toast(msg, isErr = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function prayerLabel(key) {
  const p = PRAYERS_STD.find(x => x.key === key);
  if (p) return p.label;
  const i = EID_KEYS.indexOf(key);
  if (i >= 0) return EID_LABELS[i];
  return key;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}

function fmtDate(s) {
  if (!s) return '';
  if (s === INDEF) return 'until further notice';
  const parts = s.split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return s;
  const [y, m, d] = parts;
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tom = new Date(today); tom.setDate(today.getDate() + 1);
  if (sameDay(date, today)) return 'Today';
  if (sameDay(date, tom)) return 'Tomorrow';
  return date.toLocaleDateString(undefined, {
    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
  });
}

function fmtRange(from, to) {
  if (!from) return '';
  if (!to || to === from) return fmtDate(from);
  if (to === INDEF) return `${fmtDate(from)} → until further notice`;
  return `${fmtDate(from)} → ${fmtDate(to)}`;
}

function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function nowIsoUtc() {
  return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
}

/* ---------- UTF-8 safe base64 ---------- */

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function base64ToUtf8(b64) {
  const clean = b64.replace(/\s+/g, '');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- GitHub API ---------- */

const GH_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
// Read-only: where the shipped reminders live, for the hide list.
const DISPLAY_BASE = `https://api.github.com/repos/${REPO_OWNER}/${DISPLAY_REPO}/contents`;

async function ghGet(path, base = GH_BASE) {
  const url = `${base}/${path}?ref=${encodeURIComponent(BRANCH)}&t=${Date.now()}`;
  const res = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
  });
  if (!res.ok) {
    const text = await res.text();
    let msg;
    try { msg = JSON.parse(text).message || text; } catch { msg = text; }
    const err = new Error(msg || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function ghPut(path, jsonContent, sha, message) {
  const url = `${GH_BASE}/${path}`;
  const body = {
    message,
    content: utf8ToBase64(JSON.stringify(jsonContent, null, 2) + '\n'),
    branch: BRANCH,
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const text = await res.text();
    let msg;
    try { msg = JSON.parse(text).message || text; } catch { msg = text; }
    const err = new Error(msg || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function loadRules() {
  const data = await ghGet(FILE_PATH);
  state.fileSha = data.sha;
  const text = base64ToUtf8(data.content);
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = { rules: [], updatedAt: null }; }
  state.rules = parsed.rules || [];
  state.updatedAt = parsed.updatedAt || null;
}

async function saveRules(rules) {
  const updatedAt = nowIsoUtc();
  const newJson = { updatedAt, rules, errors: [] };
  let result;
  try {
    result = await ghPut(FILE_PATH, newJson, state.fileSha, 'admin: update prayer time overrides');
  } catch (e) {
    if (e.status === 409 || /sha/i.test(e.message)) {
      // Conflict — refetch and retry once
      await loadRules();
      result = await ghPut(FILE_PATH, newJson, state.fileSha, 'admin: update prayer time overrides');
    } else {
      throw e;
    }
  }
  state.fileSha = result.content && result.content.sha;
  state.rules = rules;
  state.updatedAt = updatedAt;
  return { ok: true, updatedAt, rules };
}

/* ---------- Reminder carousel (ayah / hadith / wisdom) ---------- */

function emptyContent() {
  return {
    show: { Ayah: true, Hadith: true, Wisdom: true },
    hidden: { Ayah: [], Hadith: [], Wisdom: [] },
    edits: { Ayah: {}, Hadith: {}, Wisdom: {} },
    items: [],
  };
}

async function loadContent() {
  let parsed = {};
  try {
    const data = await ghGet(CONTENT_PATH);
    state.contentSha = data.sha;
    try { parsed = JSON.parse(base64ToUtf8(data.content)); } catch { parsed = {}; }
  } catch (e) {
    // 404 just means nobody has curated anything yet; the first save creates it.
    if (e.status !== 404) throw e;
    state.contentSha = null;
  }
  const base = emptyContent();
  state.content = {
    show: { ...base.show, ...(parsed.show || {}) },
    hidden: { ...base.hidden, ...(parsed.hidden || {}) },
    edits: { ...base.edits, ...(parsed.edits || {}) },
    items: Array.isArray(parsed.items) ? parsed.items : [],
  };
}

// The shipped ayahs/hadiths/sayings live in the display repo, not the website
// repo this page writes to. Two ways in, depending on how this page was opened:
//   - Pi-served (plain http): read them straight off the kiosk, same origin,
//     which is also the copy actually on screen.
//   - Hosted over https: browsers block a plain-http fetch to the Pi as mixed
//     content, so go through the GitHub API instead. Needs the token to have
//     Contents: Read on alton-masjid-display.
// Either way this only powers the per-item hide list — the category toggles and
// adding your own reminders work regardless.
async function loadBuiltins() {
  const files = { Ayah: 'ayahs.json', Hadith: 'hadiths.json', Wisdom: 'sayings.json' };
  const out = { Ayah: [], Hadith: [], Wisdom: [] };
  const fromPi = location.protocol === 'http:';
  try {
    await Promise.all(Object.entries(files).map(async ([kind, file]) => {
      if (fromPi) {
        const res = await fetch(`${PI_URL.replace(/\/+$/, '')}/data/${file}`, { cache: 'no-store' });
        if (res.ok) out[kind] = await res.json();
      } else {
        const data = await ghGet(`data/${file}`, DISPLAY_BASE);
        out[kind] = JSON.parse(base64ToUtf8(data.content));
      }
    }));
    state.builtinsErr = null;
  } catch (e) {
    state.builtinsErr = fromPi
      ? 'Kiosk unreachable — connect to the mosque network or Tailscale to hide '
        + 'individual reminders. Categories and your own additions still work.'
      : 'Could not read the shipped reminders from GitHub '
        + `(${e.message || 'unknown error'}). The token needs Contents: Read on `
        + 'alton-masjid-display. Categories and your own additions still work.';
  }
  state.builtins = out;
}

async function saveContent(next) {
  const payload = { updatedAt: nowIsoUtc(), ...next };
  let result;
  try {
    result = await ghPut(CONTENT_PATH, payload, state.contentSha, 'admin: update reminder carousel');
  } catch (e) {
    if (e.status === 409 || /sha/i.test(e.message)) {
      await loadContent();
      result = await ghPut(CONTENT_PATH, payload, state.contentSha, 'admin: update reminder carousel');
    } else {
      throw e;
    }
  }
  state.contentSha = result.content && result.content.sha;
  state.content = next;
}

async function applyContentMutation(mutator) {
  const current = JSON.parse(JSON.stringify(state.content || emptyContent()));
  const next = mutator(current);
  if (!next) return;
  toast('Saving…');
  try {
    await saveContent(next);
    toast('Saved to GitHub');
    state.adding = null;
    state.editing = null;
    render();
  } catch (e) {
    if (e.status === 401 || e.status === 403) {
      localStorage.removeItem(AUTH_KEY);
      pat = '';
      renderAuth('Session rejected. Please sign in again.');
      return;
    }
    toast(e.message || 'Save failed', true);
  }
}

// Every reminder the kiosk could show, shipped and added, tagged with whether
// it is currently visible. Mirrors buildPool() in js/content.js.
//
// `ref` is the reference the item shipped with and is what every row button
// addresses; `item` is what the kiosk actually shows, so an edited shipped item
// carries the imam's wording (and his reference, if he changed that too).
function allReminders() {
  const content = state.content || emptyContent();
  const builtins = state.builtins || { Ayah: [], Hadith: [], Wisdom: [] };
  const rows = [];
  for (const kind of REMINDER_KINDS) {
    const hidden = new Set(content.hidden?.[kind] || []);
    const edits = content.edits?.[kind] || {};
    const own = (content.items || []).filter(i => i && i.kind === kind);
    for (const item of [...(builtins[kind] || []), ...own]) {
      const ref = item.reference || '';
      const custom = own.includes(item);
      const edit = custom ? null : edits[ref];
      rows.push({
        kind,
        ref,
        item: edit ? { ...item, ...edit } : item,
        custom,
        edited: !!edit,
        hidden: hidden.has(ref),
        categoryOff: content.show?.[kind] === false,
      });
    }
  }
  return rows;
}

/* ---------- Data shaping ---------- */

function groupEid(rules) {
  const groups = {};
  const others = [];
  for (const r of rules) {
    if (EID_KEYS.includes(r.prayer)) {
      const g = groups[r.from] = groups[r.from] || { date: r.from, note: '', prayers: {} };
      g.prayers[r.prayer] = r.iqamah;
      if (r.note && !g.note) g.note = r.note;
    } else {
      others.push(r);
    }
  }
  const eidEvents = Object.values(groups).sort((a, b) => a.date.localeCompare(b.date));
  others.sort((a, b) => a.from.localeCompare(b.from) || a.prayer.localeCompare(b.prayer));
  return { eidEvents, others };
}

function flattenRules(others, eidEvents) {
  const out = [...others];
  for (const e of eidEvents) {
    for (const k of EID_KEYS) {
      if (e.prayers[k]) {
        out.push({ from: e.date, to: e.date, prayer: k, iqamah: e.prayers[k], note: e.note || '' });
      }
    }
  }
  return out;
}

/* ---------- Auth screen ---------- */

function renderAuth(message = '') {
  root.innerHTML = `
    <div class="auth-block">
      <h1>Alton Islamic Centre - Admin</h1>
      <p class="desc">Paste your access token to continue. It stays on this
        device — you will only be asked once.</p>
      ${message ? `<div class="err-msg">${escapeHtml(message)}</div>` : ''}
      <input id="pw" type="password" placeholder="Access token" autocomplete="off"
        spellcheck="false" autocapitalize="off">
      <button class="primary" id="auth-go">Continue</button>
    </div>`;
  const input = document.getElementById('pw');
  const go = document.getElementById('auth-go');
  go.onclick = async () => {
    const v = input.value.trim();
    if (!v) return;
    go.disabled = true;
    go.textContent = 'Verifying…';
    pat = v;
    try {
      // The token is only stored once GitHub has actually accepted it, so a
      // mistyped one never gets cached and silently fails on every later visit.
      await loadRules();
      await loadContent();
      await loadBuiltins();
      localStorage.setItem(AUTH_KEY, v);
      render();
    } catch (e) {
      pat = '';
      const msg = e.status === 401 || e.status === 403
        ? 'That token was rejected. Check it was copied in full and has not expired.'
        : (e.message || 'Sign-in failed');
      renderAuth(msg);
    }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') go.click();
  });
  input.focus();
}

function signOut() {
  if (!confirm('Sign out from this device?')) return;
  localStorage.removeItem(AUTH_KEY);
  pat = '';
  state = { rules: [], updatedAt: null, fileSha: null, adding: null, editing: null,
            kioskStatus: null, content: null, contentSha: null, builtins: null, builtinsErr: null,
            filter: { q: '', kind: 'all', status: 'all' } };
  renderAuth();
}

/* ---------- Main render ---------- */

function render() {
  const { eidEvents, others } = groupEid(state.rules);
  const updated = state.updatedAt ? new Date(state.updatedAt).toLocaleString() : '—';

  let ovdList;
  if (others.length === 0 && state.adding !== 'ovd') {
    ovdList = '<p class="empty">No active overrides.</p>';
  } else {
    ovdList = others.map((r, i) => {
      if (state.editing && state.editing.kind === 'ovd' && state.editing.idx === i) {
        return ovdFormHtml(r, 'edit');
      }
      return ovdCardHtml(r, i);
    }).join('');
  }

  let eidList;
  if (eidEvents.length === 0 && state.adding !== 'eid') {
    eidList = '<p class="empty">No Eid events scheduled.</p>';
  } else {
    eidList = eidEvents.map(e => {
      if (state.editing && state.editing.kind === 'eid' && state.editing.date === e.date) {
        return eidFormHtml(e, 'edit');
      }
      return eidCardHtml(e);
    }).join('');
  }

  const addOvdBlock = state.adding === 'ovd'
    ? ovdFormHtml(null, 'add')
    : `<button class="add-btn" data-act="add-ovd">+ Add override</button>`;
  const addEidBlock = state.adding === 'eid'
    ? eidFormHtml(null, 'add')
    : `<button class="add-btn" data-act="add-eid">+ Add Eid event</button>`;
  // The list is long, so the add button sits at both ends. The form itself
  // opens at the top only — two live copies would be two competing forms.
  const addItemBtn = `<button class="add-btn" data-act="add-item">+ Add reminder</button>`;
  const addItemTop = state.adding === 'item' ? itemFormHtml() : addItemBtn;
  const addItemBottom = state.adding === 'item' ? '' : addItemBtn;
  const visibleCount = allReminders().filter(r => !r.hidden && !r.categoryOff).length;

  root.innerHTML = `
    <header class="page">
      <h1>Alton Islamic Centre - Admin</h1>
      <span class="updated">Last saved: ${escapeHtml(updated)}
        <button class="signout" data-act="signout">sign out</button>
      </span>
    </header>

    <div class="info-banner">
      <span class="banner-actions">
        <button class="primary" data-act="refresh-kiosk">Refresh kiosk</button>
        <button class="primary" data-act="pull-kiosk" title="Pull latest code from GitHub on the Pi">Pull latest</button>
      </span>
    </div>
    <div class="kiosk-status${state.kioskStatus ? ' ' + state.kioskStatus.kind : ''}" id="kiosk-status">${state.kioskStatus ? `<span>${escapeHtml(state.kioskStatus.text)}</span><span class="ts">${escapeHtml(state.kioskStatus.ts)}</span>` : ''}</div>

    <section class="card">
      <h2>Prayer overrides <span class="count">${others.length} active</span></h2>
      ${ovdList}
      ${addOvdBlock}
    </section>

    <section class="card">
      <h2>Eid events <span class="count">${eidEvents.length} planned</span></h2>
      ${eidList}
      ${addEidBlock}
    </section>

    <section class="card">
      <h2>Reminders on screen <span class="count">${visibleCount} showing</span></h2>
      ${addItemTop}
      ${remindersHtml()}
      ${addItemBottom}
    </section>
  `;

  wireUp();
}

function filteredReminders() {
  const f = state.filter;
  const q = f.q.trim().toLowerCase();
  return allReminders().filter(r => {
    if (f.kind !== 'all' && r.kind !== f.kind) return false;
    const off = r.hidden || r.categoryOff;
    if (f.status === 'showing' && off) return false;
    if (f.status === 'hidden' && !off) return false;
    if (!q) return true;
    const hay = [
      r.item.translations?.en || '',
      r.item.arabic || '',
      r.item.reference || '',
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

// Only the list is re-rendered while filtering, so the search box keeps focus
// and the caret stays put between keystrokes.
function reminderListHtml() {
  const rows = filteredReminders();
  const total = allReminders().length;

  if (rows.length === 0) {
    return `<p class="empty">${total === 0
      ? 'No reminders found.'
      : 'Nothing matches this filter.'}</p>`;
  }

  const count = `<div class="filter-count">Showing ${rows.length} of ${total}</div>`;

  return count + rows.map(r => {
    if (isEditingItem(r)) return itemFormHtml(r);
    const en = r.item.translations?.en || '';
    const arabic = r.item.arabic || '';
    const off = r.hidden || r.categoryOff;
    const addr = `data-kind="${escapeHtml(r.kind)}" data-ref="${escapeHtml(r.ref)}"`;
    return `
      <div class="item${off ? ' dimmed' : ''}">
        <div class="info">
          <div class="top">
            <span class="pill">${escapeHtml(r.kind)}</span>
            ${r.custom ? '<span class="pill">added</span>' : ''}
            ${r.edited ? '<span class="pill">edited</span>' : ''}
            ${r.categoryOff ? '<span class="pill">category off</span>' : ''}
            ${r.hidden ? '<span class="pill">hidden</span>' : ''}
          </div>
          ${arabic ? `<div class="arabic-line" dir="rtl" lang="ar">${escapeHtml(arabic)}</div>` : ''}
          <div class="when">${escapeHtml(en)}</div>
          <div class="note">${escapeHtml(r.item.reference || '')}</div>
        </div>
        <div class="actions">
          <button class="ghost" data-act="edit-item" ${addr}>Edit</button>
          <button class="ghost" data-act="toggle-item" ${addr}>${r.hidden ? 'Show' : 'Hide'}</button>
          ${r.custom
            ? `<button class="danger" data-act="del-item" ${addr}>Delete</button>`
            : r.edited
              ? `<button class="danger" data-act="revert-item" ${addr}>Undo edit</button>`
              : ''}
        </div>
      </div>`;
  }).join('');
}

function remindersHtml() {
  const content = state.content || emptyContent();
  const rows = allReminders();
  const f = state.filter;

  const toggles = REMINDER_KINDS.map(kind => {
    const on = content.show?.[kind] !== false;
    const n = rows.filter(r => r.kind === kind && !r.hidden).length;
    return `
      <button class="ghost kind-toggle${on ? ' on' : ''}" data-act="toggle-kind" data-kind="${kind}">
        ${on ? '&#10003;' : '&#10007;'} ${escapeHtml(kind)}
        <span class="count">${n}</span>
      </button>`;
  }).join('');

  const opt = (val, label, sel) =>
    `<option value="${val}"${val === sel ? ' selected' : ''}>${label}</option>`;

  const filterBar = `
    <div class="filter-bar">
      <input id="rem-q" type="search" placeholder="Search text, Arabic or reference"
        value="${escapeHtml(f.q)}" autocomplete="off">
      <select id="rem-kind">
        ${opt('all', 'All types', f.kind)}
        ${REMINDER_KINDS.map(k => opt(k, k, f.kind)).join('')}
      </select>
      <select id="rem-status">
        ${opt('all', 'All', f.status)}
        ${opt('showing', 'On screen', f.status)}
        ${opt('hidden', 'Hidden', f.status)}
      </select>
    </div>`;

  const note = state.builtinsErr
    ? `<p class="empty">${escapeHtml(state.builtinsErr)}</p>`
    : '';

  return `<div class="kind-toggles">${toggles}</div>${filterBar}${note}`
    + `<div id="reminder-list">${reminderListHtml()}</div>`;
}

function refreshReminderList() {
  const el = document.getElementById('reminder-list');
  if (!el) return;
  el.innerHTML = reminderListHtml();
  wireReminderRows(el);
}

// The filter re-renders only the list, so its rows and any open editor have to
// be re-wired here rather than by wireUp().
function wireReminderRows(scope) {
  scope.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const act = el.dataset.act;
      if (act === 'toggle-item') onToggleItem(el.dataset.kind, el.dataset.ref);
      else if (act === 'del-item') onDeleteItem(el.dataset.kind, el.dataset.ref);
      else if (act === 'revert-item') onRevertItem(el.dataset.kind, el.dataset.ref);
      else if (act === 'edit-item') onEditItem(el.dataset.kind, el.dataset.ref);
      else if (act === 'cancel') { state.adding = null; state.editing = null; render(); }
    });
  });
  scope.querySelectorAll('form[data-form="item"]').forEach(f => {
    f.addEventListener('submit', onSubmitItem);
  });
}

function onEditItem(kind, ref) {
  const row = findReminder(kind, ref);
  if (!row) return;
  state.editing = { kind: 'item', itemKind: row.kind, ref: row.ref };
  state.adding = null;
  render();
}

function isEditingItem(row) {
  const e = state.editing;
  return !!e && e.kind === 'item' && e.itemKind === row.kind && e.ref === row.ref;
}

// One form for both jobs. A shipped reminder cannot be moved to another type —
// the edit is an overlay on the item where it sits in its own source file — so
// the type is fixed there and only the wording is open. His own additions can
// still be retyped.
function itemFormHtml(row) {
  const editing = !!row;
  const item = row ? row.item : null;
  const en = item?.translations?.en || '';
  const arabic = item?.arabic || '';
  const reference = item?.reference || '';
  const sel = row && row.custom ? row.kind : '';
  const kindField = editing && !row.custom
    ? `<input type="hidden" name="kind" value="${escapeHtml(row.kind)}">
       <div class="fixed-kind">${escapeHtml(row.kind)} &middot; came with the display</div>`
    : `<select name="kind" required>
         ${REMINDER_KINDS.map(k =>
           `<option value="${k}"${k === sel ? ' selected' : ''}>${k}</option>`).join('')}
       </select>`;
  const addr = editing
    ? ` data-kind="${escapeHtml(row.kind)}" data-ref="${escapeHtml(row.ref)}"`
    : '';
  return `
    <form class="editor" data-form="item"${addr}>
      <h3>${editing ? 'Edit reminder' : 'New reminder'}</h3>
      <label><span class="lbl">Type</span>
        ${kindField}
      </label>
      <label><span class="lbl">English text</span>
        <textarea name="en" rows="3" required placeholder="Shown on screen below the Arabic">${escapeHtml(en)}</textarea>
      </label>
      <label><span class="lbl">Arabic (optional)</span>
        <textarea name="arabic" rows="2" dir="rtl" placeholder="Leave blank for English only">${escapeHtml(arabic)}</textarea>
      </label>
      <label><span class="lbl">Reference</span>
        <input name="reference" required placeholder="e.g. Surah Al-Baqarah 2:255" value="${escapeHtml(reference)}">
      </label>
      <div class="form-actions">
        <button type="button" class="ghost" data-act="cancel">Cancel</button>
        <button type="submit" class="primary">${editing ? 'Save' : 'Add reminder'}</button>
      </div>
    </form>`;
}

function wireUp() {
  root.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      const act = el.dataset.act;
      if (act === 'add-ovd') { state.adding = 'ovd'; state.editing = null; render(); }
      else if (act === 'add-eid') { state.adding = 'eid'; state.editing = null; render(); }
      else if (act === 'cancel') { state.adding = null; state.editing = null; render(); }
      else if (act === 'edit-ovd') { state.editing = { kind: 'ovd', idx: parseInt(el.dataset.i, 10) }; state.adding = null; render(); }
      else if (act === 'edit-eid') { state.editing = { kind: 'eid', date: el.dataset.date }; state.adding = null; render(); }
      else if (act === 'del-ovd') { onDeleteOverride(parseInt(el.dataset.i, 10)); }
      else if (act === 'del-eid') { onDeleteEid(el.dataset.date); }
      else if (act === 'add-item') { state.adding = 'item'; state.editing = null; render(); }
      else if (act === 'toggle-kind') { onToggleKind(el.dataset.kind); }
      else if (act === 'toggle-item') { onToggleItem(el.dataset.kind, el.dataset.ref); }
      else if (act === 'edit-item') { onEditItem(el.dataset.kind, el.dataset.ref); }
      else if (act === 'del-item') { onDeleteItem(el.dataset.kind, el.dataset.ref); }
      else if (act === 'revert-item') { onRevertItem(el.dataset.kind, el.dataset.ref); }
      else if (act === 'signout') { signOut(); }
      else if (act === 'refresh-kiosk') { onRefreshKiosk(); }
      else if (act === 'pull-kiosk') { onPullKiosk(); }
    });
  });

  root.querySelectorAll('form[data-form]').forEach(f => {
    if (f.dataset.form === 'ovd') {
      f.addEventListener('submit', onSubmitOvd);
      const indefEl = f.querySelector('input[name="indef"]');
      const toBlock = f.querySelector('[data-todate]');
      const sync = () => { toBlock.style.display = indefEl.checked ? 'none' : ''; };
      indefEl.addEventListener('change', sync);
      sync();

      // Khutbah is a Jumu'ah-only concept, so the field only appears for one —
      // and the time below it is the salah, not a jama'ah, when it does.
      const prayerEl = f.querySelector('select[name="prayer"]');
      const khutbahBlock = f.querySelector('[data-khutbah]');
      const timeLbl = f.querySelector('[data-timelbl]');
      const syncJumma = () => {
        const jumma = isJumma(prayerEl.value);
        khutbahBlock.style.display = jumma ? '' : 'none';
        timeLbl.textContent = jumma ? 'Salah time' : "Jama'ah time";
      };
      prayerEl.addEventListener('change', syncJumma);
      syncJumma();
    } else if (f.dataset.form === 'eid') {
      f.addEventListener('submit', onSubmitEid);
    } else if (f.dataset.form === 'item') {
      f.addEventListener('submit', onSubmitItem);
    }
    f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Filtering only re-renders the list, so the search box keeps focus between
  // keystrokes; a full render() would drop the caret on every character.
  const q = document.getElementById('rem-q');
  if (q) {
    q.addEventListener('input', () => { state.filter.q = q.value; refreshReminderList(); });
  }
  const kindSel = document.getElementById('rem-kind');
  if (kindSel) {
    kindSel.addEventListener('change', () => { state.filter.kind = kindSel.value; refreshReminderList(); });
  }
  const statusSel = document.getElementById('rem-status');
  if (statusSel) {
    statusSel.addEventListener('change', () => { state.filter.status = statusSel.value; refreshReminderList(); });
  }
}

function setKioskStatus(text, kind) {
  state.kioskStatus = { text, kind, ts: new Date().toLocaleTimeString() };
  const el = document.getElementById('kiosk-status');
  if (!el) return;
  el.className = 'kiosk-status' + (kind ? ' ' + kind : '');
  el.innerHTML = `<span>${escapeHtml(text)}</span><span class="ts">${escapeHtml(state.kioskStatus.ts)}</span>`;
}

function callPiAction(path, pending) {
  const url = PI_URL.replace(/\/+$/, '');
  const key = getRefreshKey();
  if (!key) {
    setKioskStatus('Refresh key not entered', 'err');
    return;
  }
  const target = `${url}${path}?key=${encodeURIComponent(key)}`;

  // HTTPS pages can't fetch plain-HTTP resources; if that's the case, fall
  // back to opening in a new tab (Pi's response page auto-closes). The
  // Pi-served copy of this file uses a same-origin URL and so always takes
  // the inline fetch path.
  const mixedContent = location.protocol === 'https:' && url.startsWith('http://');
  if (mixedContent) {
    setKioskStatus(`${pending} — opened in new tab (HTTPS→HTTP can't run inline)`, 'pending');
    window.open(target, '_blank', 'noopener');
    return;
  }

  setKioskStatus(`${pending}…`, 'pending');
  fetch(target, { headers: { 'Accept': 'application/json' } })
    .then(async r => {
      let data = null;
      try { data = await r.json(); } catch (_) {}
      const msg = data?.message || (r.ok ? 'Done' : `HTTP ${r.status}`);
      const ok = r.ok && data?.ok !== false;
      // A wrong key would otherwise be stuck in localStorage forever, failing
      // silently on every later click. Forget it so the next click re-prompts.
      if (r.status === 403) localStorage.removeItem(REFRESH_KEY_STORE);
      setKioskStatus(`${ok ? '✓' : '✗'} ${msg}`, ok ? 'ok' : 'err');
    })
    .catch(e => {
      setKioskStatus(`✗ ${pending} failed — ${e.message || 'network error'}`, 'err');
    });
}

function onRefreshKiosk() { callPiAction('/refresh', 'Refreshing'); }
function onPullKiosk() { callPiAction('/pull', 'Pulling'); }

/* ---------- Mutations ---------- */

async function applyMutation(mutator) {
  const { eidEvents, others } = groupEid(state.rules);
  const next = mutator({ eidEvents, others });
  if (!next) return;
  const newRules = flattenRules(next.others, next.eidEvents);
  toast('Saving…');
  try {
    await saveRules(newRules);
    toast('Saved to GitHub');
    state.adding = null;
    state.editing = null;
    render();
  } catch (e) {
    if (e.status === 401 || e.status === 403) {
      localStorage.removeItem(AUTH_KEY);
      pat = '';
      renderAuth('Session rejected. Please sign in again.');
      return;
    }
    toast(e.message || 'Save failed', true);
  }
}

function isJumma(prayer) {
  return String(prayer || '').startsWith('jumma');
}

function readOvdForm(f) {
  const prayer = f.prayer.value;
  const iqamah = f.iqamah.value;
  const khutbah = (f.khutbah?.value || '').trim();
  const from = f.from.value;
  const to = f.indef.checked ? INDEF : (f.to.value || INDEF);
  if (!prayer || !iqamah || !from) return { error: 'Fill all required fields' };
  if (to !== INDEF && to < from) return { error: '"To" date is before "From" date' };
  const rule = { from, to, prayer, iqamah };
  // Khutbah only applies to Jumu'ah; carrying it on a Fajr rule would be noise
  // the kiosk never reads. Times are HH:MM so they compare as strings.
  if (isJumma(prayer) && khutbah) {
    if (khutbah >= iqamah) return { error: 'Khutbah must be before the Salah time' };
    rule.khutbah = khutbah;
  }
  return { rule };
}

function onSubmitOvd(ev) {
  ev.preventDefault();
  const f = ev.target;
  const result = readOvdForm(f);
  if (result.error) { toast(result.error, true); return; }
  const editing = state.editing;
  applyMutation(({ eidEvents, others }) => {
    if (editing && editing.kind === 'ovd') {
      const old = others[editing.idx];
      const note = old?.note || '';
      others.splice(editing.idx, 1, { ...result.rule, note });
    } else {
      others.push({ ...result.rule, note: '' });
    }
    return { eidEvents, others };
  });
}

function onDeleteOverride(idx) {
  if (!confirm('Delete this override?')) return;
  applyMutation(({ eidEvents, others }) => {
    others.splice(idx, 1);
    return { eidEvents, others };
  });
}

function readEidForm(f) {
  const date = f.date.value;
  const note = f.note.value.trim();
  const prayers = { eid1: f.eid1.value, eid2: f.eid2.value, eid3: f.eid3.value };
  const haveAny = Object.values(prayers).some(v => v);
  if (!date || !note || !haveAny) {
    return { error: 'Need date, header, and at least one salah time' };
  }
  return { event: { date, note, prayers }, origDate: f.dataset.origDate || null };
}

function onSubmitEid(ev) {
  ev.preventDefault();
  const f = ev.target;
  const result = readEidForm(f);
  if (result.error) { toast(result.error, true); return; }
  applyMutation(({ eidEvents, others }) => {
    const filtered = eidEvents.filter(e =>
      e.date !== result.event.date && e.date !== result.origDate
    );
    filtered.push(result.event);
    return { eidEvents: filtered, others };
  });
}

function onDeleteEid(date) {
  if (!confirm('Delete this Eid event?')) return;
  applyMutation(({ eidEvents, others }) => ({
    eidEvents: eidEvents.filter(e => e.date !== date),
    others,
  }));
}

/* ---------- Reminder actions ---------- */

function onToggleKind(kind) {
  if (!REMINDER_KINDS.includes(kind)) return;
  applyContentMutation(next => {
    next.show[kind] = next.show[kind] === false;
    return next;
  });
}

// Rows are addressed by kind + reference rather than list position, so the
// filter can reorder or hide rows without the buttons acting on the wrong one.
function findReminder(kind, ref) {
  return allReminders().find(r => r.kind === kind && r.ref === ref);
}

function onToggleItem(kind, ref) {
  const row = findReminder(kind, ref);
  if (!row) return;
  applyContentMutation(next => {
    const list = next.hidden[row.kind] || (next.hidden[row.kind] = []);
    const at = list.indexOf(row.ref);
    if (at === -1) list.push(row.ref);
    else list.splice(at, 1);
    return next;
  });
}

function onDeleteItem(kind, ref) {
  const row = findReminder(kind, ref);
  if (!row || !row.custom) return;
  if (!confirm('Delete this reminder? Ones that came with the display can be hidden instead.')) return;
  applyContentMutation(next => {
    next.items = (next.items || []).filter(
      it => !(it.kind === row.kind && (it.reference || '') === row.ref));
    // Drop any stale hide entry so re-adding the same reference shows up again.
    next.hidden[row.kind] = (next.hidden[row.kind] || []).filter(r => r !== row.ref);
    return next;
  });
}

// Throws away the imam's wording for a shipped reminder; the original text in
// the display's own data files comes back.
function onRevertItem(kind, ref) {
  const row = findReminder(kind, ref);
  if (!row || !row.edited) return;
  if (!confirm('Put this reminder back to the wording it came with?')) return;
  applyContentMutation(next => {
    if (next.edits?.[row.kind]) delete next.edits[row.kind][row.ref];
    return next;
  });
}

function onSubmitItem(e) {
  e.preventDefault();
  const f = e.target;
  const kind = f.kind.value;
  const en = f.en.value.trim();
  const arabic = f.arabic.value.trim();
  const reference = f.reference.value.trim();
  // Present only while editing; identifies the row being saved.
  const editRef = f.dataset.ref;
  const row = editRef === undefined ? null : findReminder(f.dataset.kind, editRef);
  if (editRef !== undefined && !row) {
    toast('That reminder is no longer there', true);
    state.editing = null;
    render();
    return;
  }
  if (!REMINDER_KINDS.includes(kind) || !en || !reference) {
    toast('Type, English text and reference are all required', true);
    return;
  }
  // References identify an item for hiding and for editing, so a duplicate
  // would make the two impossible to tell apart in either list. The row being
  // edited is matched by kind + shipped reference, not by identity — the list
  // below is rebuilt, so its objects are never the same ones as `row`.
  const isSelf = r => !!row && r.kind === row.kind && r.ref === row.ref;
  const clash = allReminders().some(r =>
    !isSelf(r) && r.kind === kind && (r.item.reference || '') === reference);
  if (clash) {
    toast('A reminder with that reference already exists', true);
    return;
  }

  if (!row) {
    applyContentMutation(next => {
      next.items = [...(next.items || []), { kind, arabic, reference, translations: { en } }];
      return next;
    });
    return;
  }

  if (row.custom) {
    // His own item is rewritten in place. The hide list is keyed by kind and
    // reference, so a change to either has to be carried over to it.
    applyContentMutation(next => {
      next.items = (next.items || []).map(it =>
        (it.kind === row.kind && (it.reference || '') === row.ref)
          ? { kind, arabic, reference, translations: { en } }
          : it);
      if (kind !== row.kind || reference !== row.ref) {
        next.hidden[row.kind] = (next.hidden[row.kind] || []).filter(r => r !== row.ref);
        if (row.hidden) {
          next.hidden[kind] = next.hidden[kind] || [];
          if (!next.hidden[kind].includes(reference)) next.hidden[kind].push(reference);
        }
      }
      return next;
    });
    return;
  }

  // A shipped item is left alone and overlaid instead, keyed by the reference
  // it shipped with, so the change survives an update to the display's data.
  applyContentMutation(next => {
    next.edits = next.edits || {};
    next.edits[row.kind] = next.edits[row.kind] || {};
    next.edits[row.kind][row.ref] = { arabic, reference, translations: { en } };
    return next;
  });
}

/* ---------- Boot ---------- */

async function init() {
  const stored = localStorage.getItem(AUTH_KEY) || '';
  if (!stored) { renderAuth(); return; }
  pat = stored;
  try {
    await loadRules();
    await loadContent();
    await loadBuiltins();
    render();
  } catch (e) {
    if (e.status === 401 || e.status === 403) {
      localStorage.removeItem(AUTH_KEY);
      pat = '';
      renderAuth('Session rejected. Please sign in again.');
    } else {
      root.innerHTML = `<div class="auth-block"><h1>Alton Islamic Centre - Admin</h1>
        <p class="desc" style="color:var(--danger)">Failed to load: ${escapeHtml(e.message || 'unknown error')}</p>
        <button class="ghost" onclick="location.reload()">Retry</button></div>`;
    }
  }
}

init();
</script>
